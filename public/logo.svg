<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mind Mapper logo">
  <defs>
    <linearGradient id="mm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="mm-glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#mm-bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#mm-glow)"/>
  <!-- branches -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <path d="M196 256 C 268 256 262 150 344 150"/>
    <path d="M196 256 L 358 256"/>
    <path d="M196 256 C 268 256 262 362 344 362"/>
  </g>
  <!-- central idea -->
  <circle cx="170" cy="256" r="66" fill="#ffffff"/>
  <circle cx="170" cy="256" r="30" fill="#7c3aed"/>
  <!-- branch ideas in the product colours -->
  <circle cx="362" cy="150" r="38" fill="#ffffff"/>
  <circle cx="362" cy="150" r="17" fill="#ec4899"/>
  <circle cx="380" cy="256" r="38" fill="#ffffff"/>
  <circle cx="380" cy="256" r="17" fill="#f59e0b"/>
  <circle cx="362" cy="362" r="38" fill="#ffffff"/>
  <circle cx="362" cy="362" r="17" fill="#10b981"/>
</svg>
