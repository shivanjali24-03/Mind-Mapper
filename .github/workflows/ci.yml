name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Check the API server
        working-directory: server
        run: |
          npm ci
          node --check server.js
          node --check routes/mindMapRoutes.js
